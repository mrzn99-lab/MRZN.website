<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OTP Login - MRZN Apps & Games</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div style="
    max-width: 400px;
    margin: 60px auto;
    padding: 30px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 16px;
  ">
    <h1 style="
      color: var(--cyan);
      text-align: center;
      margin-bottom: 10px;
      font-size: 24px;
    ">📱 OTP Login</h1>
    
    <p style="
      text-align: center;
      color: var(--text-faint);
      margin-bottom: 30px;
      font-size: 13px;
    ">Secure login with One-Time Password</p>

    <!-- Step 1: Email Input -->
    <div id="step-email" style="display: flex; flex-direction: column; gap: 16px;">
      <input 
        type="email" 
        id="email-input" 
        placeholder="your@email.com" 
        required
        style="
          padding: 12px 14px;
          border: 1px solid var(--line);
          border-radius: 10px;
          background: var(--void);
          color: var(--text);
          font-family: inherit;
          font-size: 14px;
          transition: all 0.2s;
        "
        onfocus="this.style.borderColor='var(--cyan)'"
        onblur="this.style.borderColor='var(--line)'"
      >

      <button id="send-otp-btn" style="
        padding: 12px;
        background: linear-gradient(135deg, var(--cyan) 0%, #0099cc 100%);
        color: var(--void);
        border: none;
        border-radius: 10px;
        font-weight: 800;
        cursor: pointer;
        font-size: 14px;
        transition: all 0.2s;
      " onmouseover="this.style.transform='translateY(-2px)'; this.style.boxShadow='0 4px 12px rgba(0,229,255,0.3)'" onmouseout="this.style.transform='none'; this.style.boxShadow='none'">
        Send OTP
      </button>

      <p style="
        text-align: center;
        color: var(--text-faint);
        font-size: 12px;
        margin-top: 20px;
      ">
        Prefer password? <a href="login.html" style="color: var(--cyan); text-decoration: none; font-weight: 600;">Login here</a>
      </p>
    </div>

    <!-- Step 2: OTP Input -->
    <div id="step-otp" style="display: none; flex-direction: column; gap: 16px;">
      <p style="
        color: var(--text-faint);
        font-size: 13px;
        text-align: center;
      ">Enter the 8-digit code sent to your email</p>

      <input 
        type="text" 
        id="otp-input" 
        placeholder="00000000" 
        maxlength="8"
        inputmode="numeric"
        required
        style="
          padding: 12px 14px;
          border: 1px solid var(--line);
          border-radius: 10px;
          background: var(--void);
          color: var(--text);
          font-family: monospace;
          font-size: 20px;
          text-align: center;
          letter-spacing: 8px;
          transition: all 0.2s;
        "
        onfocus="this.style.borderColor='var(--cyan)'"
        onblur="this.style.borderColor='var(--line)'"
      >

      <button id="verify-otp-btn" style="
        padding: 12px;
        background: linear-gradient(135deg, var(--cyan) 0%, #0099cc 100%);
        color: var(--void);
        border: none;
        border-radius: 10px;
        font-weight: 800;
        cursor: pointer;
        font-size: 14px;
        transition: all 0.2s;
      " onmouseover="this.style.transform='translateY(-2px)'; this.style.boxShadow='0 4px 12px rgba(0,229,255,0.3)'" onmouseout="this.style.transform='none'; this.style.boxShadow='none'">
        Verify OTP
      </button>

      <button id="resend-btn" style="
        padding: 10px;
        background: transparent;
        color: var(--cyan);
        border: 1px solid var(--cyan);
        border-radius: 10px;
        cursor: pointer;
        font-size: 13px;
        font-weight: 600;
        transition: all 0.2s;
      " onmouseover="this.style.opacity='0.7'" onmouseout="this.style.opacity='1'">
        🔄 Resend OTP
      </button>

      <button id="back-btn" style="
        padding: 10px;
        background: transparent;
        color: var(--text-dim);
        border: 1px solid var(--line);
        border-radius: 10px;
        cursor: pointer;
        font-size: 13px;
        transition: all 0.2s;
      " onmouseover="this.style.borderColor='var(--text-dim)'" onmouseout="this.style.borderColor='var(--line)'">
        ← Back
      </button>
    </div>

    <div id="otp-message" style="
      margin-top: 20px;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      font-size: 13px;
      display: none;
    "></div>
  </div>

  <script src="js/supabase-client.js"></script>
  <script>
    const emailInput = document.getElementById('email-input');
    const sendOtpBtn = document.getElementById('send-otp-btn');
    const stepEmail = document.getElementById('step-email');
    const stepOtp = document.getElementById('step-otp');
    const otpInput = document.getElementById('otp-input');
    const verifyOtpBtn = document.getElementById('verify-otp-btn');
    const resendBtn = document.getElementById('resend-btn');
    const backBtn = document.getElementById('back-btn');
    const messageDiv = document.getElementById('otp-message');

    let userEmail = '';
    let timer = 0;

    // ============ SEND OTP ============
    sendOtpBtn.addEventListener('click', async () => {
      const email = emailInput.value.trim();
      
      if (!email) {
        showMessage('❌ Please enter email', 'error');
        return;
      }

      sendOtpBtn.disabled = true;
      sendOtpBtn.textContent = '⏳ Sending...';

      try {
        const { error } = await supabaseClient.auth.signInWithOtp({
          email: email,
          options: {
            shouldCreateUser: true
          }
        });

        if (error) throw error;

        userEmail = email;
        stepEmail.style.display = 'none';
        stepOtp.style.display = 'flex';
        otpInput.focus();
        showMessage('✅ OTP sent! Check your email', 'success');
        startResendTimer();

      } catch (err) {
        showMessage(`❌ ${err.message}`, 'error');
      } finally {
        sendOtpBtn.disabled = false;
        sendOtpBtn.textContent = 'Send OTP';
      }
    });

    // ============ VERIFY OTP ============
    verifyOtpBtn.addEventListener('click', async () => {
      const otp = otpInput.value.trim();
      
      if (!otp || otp.length !== 8) {
        showMessage('❌ Enter 8-digit code', 'error');
        return;
      }

      verifyOtpBtn.disabled = true;
      verifyOtpBtn.textContent = '⏳ Verifying...';

      try {
        const { data, error } = await supabaseClient.auth.verifyOtp({
          email: userEmail,
          token: otp,
          type: 'email'
        });

        if (error) throw error;

        showMessage('✅ Login successful! Redirecting...', 'success');
        setTimeout(() => {
          window.location.href = 'index.html';
        }, 1500);

      } catch (err) {
        showMessage(`❌ ${err.message}`, 'error');
      } finally {
        verifyOtpBtn.disabled = false;
        verifyOtpBtn.textContent = 'Verify OTP';
      }
    });

    // ============ RESEND OTP ============
    resendBtn.addEventListener('click', async () => {
      if (resendBtn.disabled) return;
      
      resendBtn.disabled = true;
      resendBtn.textContent = '⏳ Resending...';

      try {
        const { error } = await supabaseClient.auth.signInWithOtp({
          email: userEmail,
          options: { shouldCreateUser: true }
        });

        if (error) throw error;
        showMessage('✅ OTP resent!', 'success');
        startResendTimer();

      } catch (err) {
        showMessage(`❌ ${err.message}`, 'error');
        resendBtn.disabled = false;
      }
    });

    // ============ BACK BUTTON ============
    backBtn.addEventListener('click', () => {
      stepOtp.style.display = 'none';
      stepEmail.style.display = 'flex';
      emailInput.focus();
      otpInput.value = '';
      messageDiv.style.display = 'none';
    });

    // ============ TIMER ============
    function startResendTimer() {
      timer = 60;
      resendBtn.disabled = true;
      
      const interval = setInterval(() => {
        timer--;
        resendBtn.textContent = `🔄 Resend in ${timer}s`;
        
        if (timer === 0) {
          clearInterval(interval);
          resendBtn.disabled = false;
          resendBtn.textContent = '🔄 Resend OTP';
        }
      }, 1000);
    }

    // ============ SHOW MESSAGE ============
    function showMessage(msg, type) {
      messageDiv.style.display = 'block';
      messageDiv.textContent = msg;
      
      if (type === 'error') {
        messageDiv.style.background = 'rgba(255,71,87,0.1)';
        messageDiv.style.border = '1px solid rgba(255,71,87,0.2)';
        messageDiv.style.color = '#ff4757';
      } else {
        messageDiv.style.background = 'rgba(0,229,255,0.1)';
        messageDiv.style.border = '1px solid rgba(0,229,255,0.2)';
        messageDiv.style.color = 'var(--cyan)';
      }
    }
  </script>
</body>
</html>
