      color: var(--text);

      font-size: 14px;

    .admin-form-group textarea {
      resize: vertical;
      min-height: 80px;
    }
    .admin-form-group input:focus,

      background: var(--void);

      display: flex;

      align-items: center;
      transition: all 0.2s;

    .admin-update-item:hover {

      background: rgba(8, 145, 178, 0.05);
    }
    .admin-update-info {
      flex: 1;
    }
    .admin-update-title {

      color: var(--text);
      margin-bottom: 4px;
    }
    .admin-update-meta {
      font-size: 12px;
      color: var(--text-faint);
    }
    .btn-delete {
      background: #dc2626;
      color: white;
      padding: 6px 12px;
      border-radius: 4px;
      border: none;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      transition: all 0.2s;
    }
    .btn-delete:hover {
      background: #b91c1c;
    }
    .admin-section {
      background: rgba(8, 145, 178, 0.05);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 24px;
    }
    .admin-section h3 {
      margin-bottom: 16px;
      font-size: 18px;
      color: var(--text);
    }
    .btn-secondary {
      background: var(--line);
      color: var(--text);
      padding: 8px 16px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.2s;

      color: var(--void);

      gap: 10px;

<div class="container" style="padding-top:36px">
  <div id="admin-guard">
    <div class="loader"><div class="ring"></div></div>
  </div>

  <div id="admin-content" style="display:none">
    <div class="section-head">
      <div>
        <div class="eyebrow">ADMIN PANEL</div>
        <h2 class="section-title">App Management</h2>
      </div>
      <button class="btn btn-primary" id="add-app-btn">+ Add New App</button>
    </div>

    <div class="toolbar" style="margin-bottom:20px">
      <div class="search-box">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="admin-search-input" placeholder="Search apps by name to edit...">
      </div>
    </div>

    <div class="panel" style="padding:0;overflow-x:auto">
      <table class="admin-table">
        <thead>
          <tr><th>Icon</th><th>Name</th><th>Category</th><th>Rating</th><th>Added</th><th>Actions</th></tr>
        </thead>
        <tbody id="admin-table-body"></tbody>
      </table>
    </div>

    <!-- ✅ NEW UPDATES MANAGEMENT SECTION -->
    <div class="section-head" style="margin-top:40px">
      <div>
        <div class="eyebrow">WEBSITE CONTENT</div>
        <h2 class="section-title">Manage Updates</h2>
      </div>
      <button class="btn btn-primary" id="new-update-btn">+ New Update</button>
    </div>

    <div class="admin-section" id="admin-updates-section">
      <!-- Update Form (Hidden by default) -->
      <div id="update-form" style="display:none; background: var(--line); padding: 16px; border-radius: 8px; margin-bottom: 20px;">
        <h3 style="margin-bottom: 16px; font-size: 16px;">Create/Edit Update</h3>
        
        <div class="admin-form-group">
          <label>Title *</label>
          <input type="text" id="update-title" placeholder="e.g., AI Assistant Launch 🤖" required>
        </div>
        
        <div class="admin-form-group">
          <label>Description *</label>
          <textarea id="update-description" placeholder="Detailed description of the update..." required></textarea>
        </div>
        
        <div class="admin-form-group">
          <label>Features (comma-separated)</label>
          <input type="text" id="update-features" placeholder="Feature 1, Feature 2, Feature 3">
        </div>
        
        <div class="admin-form-group">
          <label>Version (e.g., v2.1.0)</label>
          <input type="text" id="update-version" placeholder="v2.1.0">
        </div>
        
        <div class="admin-form-group">
          <label>Image URL</label>
          <input type="url" id="update-image-url" placeholder="https://... (Supabase Storage URL)">
          <small style="color: var(--text-faint); display: block; margin-top: 4px;">Upload image to Supabase Storage first, then paste URL here</small>
        </div>
        
        <div class="form-actions">
          <button type="button" class="btn btn-primary" onclick="saveUpdate()">Save Update</button>

<!-- ADD/EDIT MODAL -->

      <button class="close-x" id="close-modal">✕</button>
    </div>
    <form id="app-form">
      <input type="hidden" id="app-id-field">
      <div class="field-group">
        <label class="field-label">App Name *</label>
        <input type="text" class="field" id="f-name" required>
      </div>
      <div class="field-group">
        <label class="field-label">Category *</label>
        <input type="text" class="field" id="f-category" required placeholder="Games, Tools, AI, Utility...">
      </div>
      <div class="field-group">
        <label class="field-label">Description *</label>
        <textarea class="field" id="f-description" required placeholder="Briefly describe the app"></textarea>
      </div>
      <div class="field-group">
        <label class="field-label">Icon URL</label>
        <input type="url" class="field" id="f-icon" placeholder="https://...">
      </div>
      <div class="field-group" style="display:flex;gap:12px">
        <div style="flex:1">
          <label class="field-label">App Size</label>
          <input type="text" class="field" id="f-size" placeholder="e.g. 45 MB">
        </div>
        <div style="flex:1">
          <label class="field-label">Downloads</label>
          <input type="text" class="field" id="f-downloads" placeholder="e.g. 10M+">
        </div>
      </div>
      <div class="field-group">
        <label class="field-label">Screenshot URLs (comma-separated)</label>

      </div>
      <div class="field-group">
        <label class="field-label">Download Link</label>
        <input type="url" class="field" id="f-download" placeholder="https://github.com/.../app.apk">
      </div>
      <div class="field-group">
        <label class="field-label">Developer Note (optional)</label>
        <textarea class="field" id="f-note" placeholder="Any special note or update info"></textarea>
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="save-app-btn">Save</button>
    </form>
  </div>

<!-- ✅ UPDATES MANAGEMENT SCRIPT -->
<script>
// ============ UPDATES MANAGEMENT ============

document.getElementById('new-update-btn').addEventListener('click', toggleUpdateForm);

function toggleUpdateForm() {
  const form = document.getElementById('update-form');
  form.style.display = form.style.display === 'none' ? 'block' : 'none';
  if (form.style.display === 'block') {
    document.getElementById('update-title').focus();
  }
}

async function saveUpdate() {
  const title = document.getElementById('update-title').value.trim();
  const description = document.getElementById('update-description').value.trim();
  const features = document.getElementById('update-features').value.trim();
  const version = document.getElementById('update-version').value.trim();
  const imageUrl = document.getElementById('update-image-url').value.trim();
  
  if (!title || !description) {
    alert('❌ Title and description are required');
    return;
  }
  
  try {
    const { error } = await window.supabaseClient
      .from('website_updates')
      .insert({
        title,
        description,
        features: features || null,
        version: version || null,
        image_url: imageUrl || null,
        status: 'published'
      });
    
    if (error) throw error;
    
    alert('✅ Update published successfully!');
    
    // Clear form
    document.getElementById('update-title').value = '';
    document.getElementById('update-description').value = '';
    document.getElementById('update-features').value = '';
    document.getElementById('update-version').value = '';
    document.getElementById('update-image-url').value = '';
    document.getElementById('update-form').style.display = 'none';
    
    // Reload list
    loadAdminUpdates();
  } catch (error) {
    console.error('Error saving update:', error);
    alert('❌ Error saving update: ' + error.message);
  }
}

async function loadAdminUpdates() {
  try {
    const { data: updates, error } = await window.supabaseClient
      .from('website_updates')
      .select('*')
      .order('published_date', { ascending: false });
    
    if (error) throw error;
    
    const container = document.getElementById('updates-list');
    
    if (!updates || updates.length === 0) {
      container.innerHTML = '<p style="color: var(--text-faint); text-align: center; padding: 20px;">No updates yet. Create your first update!</p>';
      return;
    }
    
    container.innerHTML = updates.map(update => `
      <div class="admin-update-item">
        <div class="admin-update-info">
          <div class="admin-update-title">${update.title}</div>
          <div class="admin-update-meta">
            ${update.version || 'v?'} • ${new Date(update.published_date).toLocaleDateString('en-US', { 
              year: 'numeric', 
              month: 'short', 
              day: 'numeric' 
            })}
          </div>
        </div>
        <button type="button" class="btn-delete" onclick="deleteUpdate(${update.id})">Delete</button>
      </div>
    `).join('');
  } catch (error) {
    console.error('Error loading updates:', error);
    document.getElementById('updates-list').innerHTML = '<p style="color: red;">Error loading updates</p>';
  }
}

async function deleteUpdate(id) {
  if (!confirm('Are you sure you want to delete this update?')) return;
  
  try {
    const { error } = await window.supabaseClient
      .from('website_updates')
      .delete()
      .eq('id', id);
    
    if (error) throw error;
    
    alert('✅ Update deleted');
    loadAdminUpdates();
  } catch (error) {
    console.error('Error deleting update:', error);
    alert('❌ Error deleting update: ' + error.message);
  }
}

// Load updates when page loads
document.addEventListener('DOMContentLoaded', () => {
  setTimeout(loadAdminUpdates, 500);
});
</script>
