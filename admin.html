    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="MRZN Apps & Games - Admin">
    <meta name="twitter:image" content="https://mrzn99-lab.github.io/MRZN.website/assets/logo.png">

    <link rel="manifest" href="./manifest.json">

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "MRZN Apps & Games",
      "url": "https://mrzn99-lab.github.io/MRZN.website/",
      "logo": "https://mrzn99-lab.github.io/MRZN.website/assets/logo.png"
    }
    </script>
    
    <!-- ✅ CSS -->
    <link rel="stylesheet" href="css/style.css">
    
    <!-- ✅ CUSTOM STYLES -->
    <style>
    .admin-form-group {
      margin-bottom: 16px;
    }
    .admin-form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      font-size: 14px;
      color: var(--text);
    }
    .admin-form-group input,
    .admin-form-group textarea {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid var(--line);
      background: var(--void);
      color: var(--text);
      font-family: inherit;
      font-size: 14px;
      box-sizing: border-box;
    }
    .admin-form-group textarea {
      resize: vertical;
      min-height: 80px;
    }
    .admin-form-group input:focus,
    .admin-form-group textarea:focus {
      outline: none;
      border-color: var(--cyan);
      box-shadow: 0 0 0 3px rgba(0, 229, 255, 0.1);
    }
    .admin-section {
      background: rgba(8, 145, 178, 0.05);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 24px;
    }
    .admin-section h3 {
      margin-bottom: 16px;
      font-size: 18px;
      color: var(--text);
    }
    .btn-secondary {
      background: var(--line);
      color: var(--text);
      padding: 8px 16px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.2s;
    }
    .btn-secondary:hover {
      background: var(--cyan);
      color: var(--void);
    }
    .form-actions {
      display: flex;
      gap: 10px;
    }
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 12px;
      margin-top: 16px;
    }
    .gallery-item {
      background: var(--void);
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      position: relative;
    }
    .gallery-item img {
      width: 100%;
      height: 150px;
      object-fit: cover;
    }
    .gallery-item-actions {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(0,0,0,0.7);
      padding: 8px;
      display: flex;
      gap: 6px;
      justify-content: center;
    }
    .gallery-item-actions button {
      background: #dc2626;
      color: white;
      padding: 4px 8px;
      border-radius: 4px;
      border: none;
      cursor: pointer;
      font-size: 11px;
      font-weight: 600;
    }
    </style>
    
    <!-- ✅ GOOGLE ANALYTICS -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-PFK6JYF7Y1"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag("js", new Date());
      gtag("config", "G-PFK6JYF7Y1");
    </script>
</head>
<body>

<nav class="navbar">
  <div class="container">
    <a href="index.html" class="brand">
      <img src="assets/logo.png" class="brand-mark" style="object-fit:cover">
      <span class="brand-name">MRZN <span>Apps & Games</span></span>
    </a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="index.html#apps">Apps</a></li>
    </ul>
    <div class="nav-user" id="nav-auth-slot"></div>
  </div>
</nav>

<div class="container" style="padding-top:36px">
  <div id="admin-guard">
    <div class="loader"><div class="ring"></div></div>
  </div>

  <div id="admin-content" style="display:none">
    <!-- ✅ APP MANAGEMENT SECTION -->
    <div class="section-head">
      <div>
        <div class="eyebrow">ADMIN PANEL</div>
        <h2 class="section-title">App Management</h2>
      </div>
      <button class="btn btn-primary" id="add-app-btn">+ Add New App</button>
    </div>

    <div class="toolbar" style="margin-bottom:20px">
      <div class="search-box">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="admin-search-input" placeholder="Search apps by name to edit...">
      </div>
    </div>

    <div class="panel" style="padding:0;overflow-x:auto">
      <table class="admin-table">
        <thead>
          <tr><th>Icon</th><th>Name</th><th>Category</th><th>Rating</th><th>Added</th><th>Actions</th></tr>
        </thead>
        <tbody id="admin-table-body"></tbody>
      </table>
    </div>

    <!-- ✅ IMAGE GALLERY SECTION -->
    <div class="section-head" style="margin-top:40px">
      <div>
        <div class="eyebrow">WEBSITE CONTENT</div>
        <h2 class="section-title">Image Gallery</h2>
      </div>
    </div>

    <div class="admin-section" id="admin-gallery-wrap">
      <button id="new-image-btn" class="btn btn-primary" style="margin-bottom: 15px;">📷 Upload Image</button>

      <div id="image-form" style="display:none; background: var(--line); padding: 16px; border-radius: 8px; margin-bottom: 20px;">
        <h3 style="margin-bottom: 16px; font-size: 16px;">📷 Post Image</h3>
        
        <div class="admin-form-group">
          <label>Image URL *</label>
          <input type="url" id="image-url-input" placeholder="https://mrzn-1st-apk.mdrafiuzzamanking99.workers.dev/image.jpg" required>
        </div>
        
        <div class="admin-form-group">
          <label>Image Title (Optional)</label>
          <input type="text" id="image-title-input" placeholder="What's this image about?">
        </div>
        
        <div class="form-actions">
          <button type="button" class="btn btn-primary" onclick="saveImage()">Save Image</button>
          <button type="button" class="btn-secondary" onclick="toggleImageForm()">Cancel</button>
        </div>
      </div>

      <div id="gallery-list"></div>
    </div>

    <!-- ✅ APP REQUESTS SECTION -->
    <div class="section-head" style="margin-top:40px">
      <div>
        <div class="eyebrow">USER SUBMISSIONS</div>
        <h2 class="section-title">App Requests</h2>
      </div>
    </div>

    <div class="panel" id="admin-requests-wrap" style="overflow-x: auto;">
      <div style="color:var(--text-faint);font-size:13.5px;text-align:center;padding:20px">Loading requests...</div>
    </div>

    <!-- ✅ FLAGGED REVIEWS SECTION -->
    <div class="section-head" style="margin-top:40px">
      <div>
        <div class="eyebrow">MODERATION</div>
        <h2 class="section-title">Flagged Reviews</h2>
      </div>
    </div>
    <div class="panel" id="flagged-reviews-wrap">
      <div style="color:var(--text-faint);font-size:13.5px">Loading...</div>
    </div>
  </div>
</div>

<!-- ADD/EDIT MODAL -->
<div class="modal-overlay" id="app-modal">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-title" id="modal-title">Add New App</div>
      <button class="close-x" id="close-modal">✕</button>
    </div>
    <form id="app-form">
      <input type="hidden" id="app-id-field">
      <div class="field-group">
        <label class="field-label">App Name *</label>
        <input type="text" class="field" id="f-name" required>
      </div>
      <div class="field-group">
        <label class="field-label">Category *</label>
        <input type="text" class="field" id="f-category" required placeholder="Games, Tools, AI, Utility...">
      </div>
      <div class="field-group">
        <label class="field-label">Description *</label>
        <textarea class="field" id="f-description" required placeholder="Briefly describe the app"></textarea>
      </div>
      <div class="field-group">
        <label class="field-label">Icon URL</label>
        <input type="url" class="field" id="f-icon" placeholder="https://...">
      </div>
      <div class="field-group" style="display:flex;gap:12px">
        <div style="flex:1">
          <label class="field-label">App Size</label>
          <input type="text" class="field" id="f-size" placeholder="e.g. 45 MB">
        </div>
        <div style="flex:1">
          <label class="field-label">Downloads</label>
          <input type="text" class="field" id="f-downloads" placeholder="e.g. 10M+">
        </div>
      </div>
      <div class="field-group">
        <label class="field-label">Screenshot URLs (comma-separated)</label>
        <input type="text" class="field" id="f-screenshots" placeholder="https://img1.png, https://img2.png">
      </div>
      <div class="field-group">
        <label class="field-label">Download Link</label>
        <input type="url" class="field" id="f-download" placeholder="https://...">
      </div>
      <div class="field-group">
        <label class="field-label">Developer Note (optional)</label>
        <textarea class="field" id="f-note" placeholder="Any special note or update info"></textarea>
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="save-app-btn">Save</button>
    </form>
  </div>
</div>

<!-- ✅ SCRIPTS -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/supabase-client.js"></script>

<script src="js/app-request.js"></script>
<script src="js/settings-apply.js"></script>
<script src="js/sound.js"></script>

<script src="js/admin.js"></script>

</body>
</html>
