<!-- ✅ DOWNLOAD SOURCES RENDERER -->
<script>
// Display download sources in app detail page
async function renderDownloadSources() {
  const appId = new URLSearchParams(window.location.search).get('id');
  if (!appId) return;
  
  try {
    const { data: app } = await window.supabaseClient
      .from('apps')
      .select('source_type, source_url, apk_size_mb, min_android_version')
      .eq('id', appId)
      .single();
    
    if (!app) return;
    
    const downloadSection = document.getElementById('download-section');
    const downloadSources = document.getElementById('download-sources');
    
    if (!downloadSection || !downloadSources) return;
    
    downloadSection.style.display = 'block';
    
    // Render sources based on type
    const sourceType = app.source_type || 'play_store';
    const sourceBadgeEl = document.querySelector('.source-badge');
    
    if (sourceType === 'play_store' || sourceType === 'both') {
      downloadSources.innerHTML = `
        <div class="download-option" onclick="window.open('https://play.google.com/store/apps/details?id=${appId}', '_blank')">
          <div class="download-option-icon">▶️</div>
          <div class="download-option-name">Play Store</div>
          <div class="download-option-meta">Official Source</div>
          <button class="btn-download">Download</button>
        </div>
      `;
    }
    
    // If source is 'both', parse JSON and add hosted source
    if (sourceType === 'both' && app.source_url) {
      try {
        const sources = JSON.parse(app.source_url);
        if (sources.hosted) {
          downloadSources.innerHTML += `
            <div class="download-option" onclick="window.open('${sources.hosted}', '_blank')">
              <div class="download-option-icon">📥</div>
              <div class="download-option-name">Direct</div>
              <div class="download-option-meta">Hosted</div>
              <button class="btn-download">Download</button>
            </div>
          `;
        }
      } catch (e) {
        console.error('Error parsing source URLs:', e);
      }
    } else if (sourceType === 'hosted' && app.source_url) {
      downloadSources.innerHTML = `
        <div class="download-option" onclick="window.open('${app.source_url}', '_blank')">
          <div class="download-option-icon">📥</div>
          <div class="download-option-name">Direct</div>
          <div class="download-option-meta">Hosted</div>
          <button class="btn-download">Download</button>
        </div>
      `;
    } else if (sourceType === 'external' && app.source_url) {
      const externalName = window.DownloadSourcesManager ? 
        window.DownloadSourcesManager.getExternalSourceName(app.source_url) : 
        'Third Party';
      
      downloadSources.innerHTML = `
        <div class="download-option" onclick="window.open('${app.source_url}', '_blank')">
          <div class="download-option-icon">🔗</div>
          <div class="download-option-name">${externalName}</div>
          <div class="download-option-meta">External</div>
          <button class="btn-download">Download</button>
        </div>
      `;
      
      // Show warning for external sources
      document.getElementById('source-warning').style.display = 'block';
      document.getElementById('warning-text').textContent = 
        'This app is hosted on a third-party platform. Download at your own risk.';
    }
    
    // Add file size and Android version info
    if (app.apk_size_mb || app.min_android_version) {
      const info = [];
      if (app.apk_size_mb) info.push(`📦 ${app.apk_size_mb}MB`);
      if (app.min_android_version) info.push(`📱 Android ${app.min_android_version}+`);
      
      if (info.length > 0) {
        downloadSources.innerHTML += `
          <div style="grid-column: 1 / -1; font-size: 12px; color: var(--text-faint); text-align: center; margin-top: 8px;">
            ${info.join(' • ')}
          </div>
        `;
      }
    }
  } catch (error) {
    console.error('Error rendering download sources:', error);
  }
}

// Load when app detail loads
document.addEventListener('DOMContentLoaded', () => {
  setTimeout(renderDownloadSources, 500);
});
</script>
