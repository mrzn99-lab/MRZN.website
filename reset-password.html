<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - MRZN Apps & Games</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div style="
    max-width: 400px;
    margin: 60px auto;
    padding: 30px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 16px;
    text-align: center;
  ">
    <h1 style="color: var(--cyan); margin-bottom: 20px;">🔐 Reset Password</h1>
    
    <form id="reset-password-form" style="display: flex; flex-direction: column; gap: 16px;">
      <input 
        type="password" 
        id="new-password" 
        placeholder="New Password" 
        required
        style="
          padding: 12px;
          border: 1px solid var(--line);
          border-radius: 10px;
          background: var(--void);
          color: var(--text);
          font-family: inherit;
        "
      >
      
      <input 
        type="password" 
        id="confirm-password" 
        placeholder="Confirm Password" 
        required
        style="
          padding: 12px;
          border: 1px solid var(--line);
          border-radius: 10px;
          background: var(--void);
          color: var(--text);
          font-family: inherit;
        "
      >

      <button type="submit" style="
        padding: 12px;
        background: linear-gradient(135deg, var(--cyan) 0%, #0099cc 100%);
        color: var(--void);
        border: none;
        border-radius: 10px;
        font-weight: 800;
        cursor: pointer;
      ">
        Reset Password
      </button>
    </form>

    <div id="reset-message" style="
      margin-top: 20px;
      padding: 12px;
      border-radius: 8px;
      display: none;
      font-size: 14px;
    "></div>
  </div>

  <script src="js/supabase-client.js"></script>
  <script>
    document.getElementById('reset-password-form').addEventListener('submit', async (e) => {
      e.preventDefault();

      const password = document.getElementById('new-password').value;
      const confirmPassword = document.getElementById('confirm-password').value;
      const messageDiv = document.getElementById('reset-message');

      if (password !== confirmPassword) {
        messageDiv.style.display = 'block';
        messageDiv.style.background = 'rgba(255,71,87,0.1)';
        messageDiv.style.color = '#ff4757';
        messageDiv.textContent = '❌ Passwords do not match';
        return;
      }

      if (password.length < 6) {
        messageDiv.style.display = 'block';
        messageDiv.style.background = 'rgba(255,71,87,0.1)';
        messageDiv.style.color = '#ff4757';
        messageDiv.textContent = '❌ Password must be at least 6 characters';
        return;
      }

      const { error } = await supabaseClient.auth.updateUser({ password });

      if (error) {
        messageDiv.style.display = 'block';
        messageDiv.style.background = 'rgba(255,71,87,0.1)';
        messageDiv.style.color = '#ff4757';
        messageDiv.textContent = `❌ ${error.message}`;
        return;
      }

      messageDiv.style.display = 'block';
      messageDiv.style.background = 'rgba(0,229,255,0.1)';
      messageDiv.style.color = 'var(--cyan)';
      messageDiv.textContent = '✅ Password reset successful! Redirecting...';

      setTimeout(() => {
        window.location.href = 'login.html';
      }, 2000);
    });
  </script>
</body>
</html>
